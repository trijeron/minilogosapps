<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="6" />

  <!-- 2x2 stylized puzzle tiles representing the 6-in-1 games -->
  <rect x="76" y="76" width="164" height="164" rx="34" fill="url(#tile1)" />
  <rect x="272" y="76" width="164" height="164" rx="34" fill="url(#tile2)" />
  <rect x="76" y="272" width="164" height="164" rx="34" fill="url(#tile3)" />
  <rect x="272" y="272" width="164" height="164" rx="34" fill="url(#tile4)" />

  <!-- Tile 1: Bold "6" (Sudoku / 6v1) -->
  <text x="158" y="186" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="96" fill="#ffffff">6</text>

  <!-- Tile 2: Crown / Sun circle motif (Tango & Queens) -->
  <circle cx="354" cy="158" r="42" fill="#fffbeb" />
  <circle cx="354" cy="158" r="24" fill="#d97706" />

  <!-- Tile 3: Spade / Card diamond motif (Bridge & Mahjong) -->
  <polygon points="158,308 202,354 158,400 114,354" fill="#ecfdf5" />

  <!-- Tile 4: Connected Zip path motif -->
  <path d="M316 392 L316 322 L392 322 L392 392" fill="none" stroke="#fff7ed" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="316" cy="392" r="14" fill="#ffffff" />
  <circle cx="392" cy="392" r="14" fill="#ffffff" />
</svg>
